name: polywars CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install py7zr

      - name: Build game (.sdz)
        run: python3 build.py --game
        working-directory: /home/al/pylonwars

      - name: Build map (.sd7)
        if: runner.needs['build'].outcome == 'success'
        run: python3 build.py --map
        working-directory: /home/al/pylonwars

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polywars-dist
          path: |
            dist/PylonWars-0.1.0.sdz
            dist/polycity.sd7
          retention-days: 30